<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokoro Reader</title>
    <script src="browser-polyfill.min.js"></script>
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="reader.css">
</head>

<body>

    <div id="filePickerOverlay">
        <div class="picker-content" id="dropZone">
            <h1>Open Document</h1>
            <p>Select or drag an EPUB, DOCX, TXT, Markdown, or HTML file here to read</p>
            <div class="file-input-wrapper">
                <label for="fileInput" class="custom-file-label">Browse...</label>
                <input type="file" id="fileInput" accept=".epub,.docx,.txt,.text,.md,.markdown,.html,.htm,.xhtml">
            </div>
            <div class="picker-options">
                <label for="scanDocumentHeadings">
                    <input type="checkbox" id="scanDocumentHeadings">
                    Scan EPUB headings instead of the publisher's chapter list
                </label>
            </div>
            <button id="cancelDocumentPicker" type="button" class="nav-btn picker-cancel" hidden>Cancel</button>
            <div id="file-name-display" class="file-name-display">No file selected.</div>
            <div id="errorMsg" role="alert" style="color: red; margin-top: 10px; display: none;"></div>
            <div id="loadingStatus" role="status" aria-live="polite" style="margin-top: 20px; display: none;">Loading...</div>
        </div>
    </div>

    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Chapters</h2>
                <button id="toggleSidebar" class="icon-btn" aria-label="Hide chapter sidebar" title="Hide chapters">«</button>
            </div>
            <div class="reader-file-actions">
                <button id="openAnotherDocument" type="button" class="nav-btn">Open another document</button>
            </div>
            <div class="nav-controls">
                <button id="prevChapter" class="nav-btn" disabled>Prev</button>
                <button id="nextChapter" class="nav-btn" disabled>Next</button>
            </div>
            <div id="chapterList" role="navigation" aria-label="Chapters"></div>
        </div>

        <div class="main-content">
            <button id="showSidebarBtn" class="icon-btn floating-sidebar-btn" style="display: none;" aria-label="Show chapter sidebar" title="Show chapters">»</button>
            <p id="chapterError" class="chapter-error" role="alert" hidden></p>
            <iframe id="playerFrame" src="overlay.html?waitForData=true" title="Kokoro Player"></iframe>
        </div>
    </div>

    <script src="jszip.min.js"></script>
    <script src="epub.min.js"></script>
    <script src="reader.js" type="module"></script>
</body>

</html>
