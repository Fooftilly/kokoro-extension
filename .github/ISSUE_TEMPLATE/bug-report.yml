name: Bug report
description: Report a defect in the Chrome/Firefox extension
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please search existing issues first.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps, including browser, extension version, and API URL shape (localhost / LAN / remote — redact secrets).
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Browser + OS + extension version (e.g. Firefox 142 / Linux / v1.3.1)"
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Kokoro-FastAPI version / config (optional)
      description: "Backend version, image tag, or deploy notes when the bug involves the API (e.g. Kokoro-FastAPI 0.7.1, docker remsky/kokoro-fastapi-gpu:latest). Leave blank if N/A."
      placeholder: "e.g. 0.7.1 / local Docker on :8880"
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What should be true when this bug is considered fixed?
      placeholder: |
        - Voice list populates against both legacy string and object API responses
        - ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Regression validation
      description: How should a fix be verified (Jest cases, manual checks, browsers)?
      placeholder: |
        - Add/adjust Jest coverage for …
        - Manual: popup voice fetch against …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console errors from the popup, background, or overlay inspector if available.
