name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package (build + Chrome/Firefox zips via pinned web-ext)
        run: npm run package:ci

      - name: Verify Chrome and Firefox manifests
        run: |
          set -euo pipefail
          for browser in chrome firefox; do
            manifest="dist/${browser}/manifest.json"
            test -f "$manifest"
            node -e "
              const m = require('./${manifest}');
              const pkg = require('./package.json');
              if (m.manifest_version !== 3) throw new Error('${browser}: expected MV3');
              if (m.version !== pkg.version) {
                throw new Error('${browser}: manifest version ' + m.version + ' != package.json ' + pkg.version);
              }
              console.log('${browser}: OK', m.name, m.version);
            "
          done
          test -f "dist/package/kokoro-extension-chrome-$(node -p "require('./package.json').version").zip"
          test -f "dist/package/kokoro-extension-firefox-$(node -p "require('./package.json').version").zip"

      - name: Upload unpacked build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-dist
          path: |
            dist/chrome/**
            dist/firefox/**
          if-no-files-found: error

      - name: Upload package ZIP artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-packages
          path: dist/package/*.zip
          if-no-files-found: error
