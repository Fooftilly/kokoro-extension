name: Real Kokoro MV3 model acceptance

# Heavy (~388 MB) model downloads and direct pinned-dictionary CORS/SRI smoke
# checks are strictly limited to explicit workflow changes
# on the experimental runtime branch or a human-triggered dispatch. Never run for
# general pull requests or releases.
on:
  push:
    branches: [feat/official-browser-runtimes-68]
    paths:
      - '.github/workflows/live-browser-acceptance.yml'
      - 'scripts/validate-live-chromium.mjs'
      - 'scripts/validate-live-firefox.py'
      - 'scripts/firefox_article_selection_acceptance.py'
      - 'scripts/article-selection-acceptance.mjs'
      - 'mediapipe-provider.js'
      - 'onnx-provider.js'
      - 'sha256-stream.js'
      - 'english-g2p.js'
  workflow_dispatch:
    inputs:
      acceptance_scope:
        description: 'Select full inference, shared two-local-backend comparison, or manual official-origin install'
        type: choice
        required: true
        default: full
        options:
          - full
          - chromium-dictionary
          - firefox-dictionary
          - firefox-mediapipe-origin
          - firefox-onnx-origin
          - firefox-dual-comparison
          - firefox-persistent-restart
          - firefox-quota-recovery
          - chromium-mediapipe-origin
          - chromium-onnx-origin
          - chromium-dual-comparison
          - chromium-quota-recovery

permissions:
  contents: read

jobs:
  chromium-model-inference:
    name: Real ONNX and MediaPipe Chromium MV3 synthesis
    if: ${{ inputs.acceptance_scope != 'firefox-dictionary' && inputs.acceptance_scope != 'firefox-mediapipe-origin' && inputs.acceptance_scope != 'firefox-onnx-origin' && inputs.acceptance_scope != 'firefox-dual-comparison' && inputs.acceptance_scope != 'firefox-persistent-restart' && inputs.acceptance_scope != 'firefox-quota-recovery' }}
    # ubuntu-latest migrated to 26.04 during Oct-Nov 2026. The manual
    # acceptance job failed before browser launch when its new image could
    # not resolve apt mirrors during Playwright install --with-deps.
    # Keep this heavyweight browser job on a stable, explicitly supported
    # LTS image until 26.04 package resolution is validated separately.
    runs-on: ubuntu-24.04
    # Version- and digest-pinned Playwright image has Chromium, Xvfb, fonts
    # and required shared libraries preinstalled. Hosted Ubuntu apt DNS failed
    # on both 24.04 and 26.04 before any browser acceptance could run.
    # The image and npm Playwright package must stay at the same version.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    # Origin download allows up to 15m for UI settle; ONNX + EPUB + article/
    # selection stages need headroom beyond the old 30m job cap (two tips
    # cancelled at exactly 30m with no report.json).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      # Python is provisioned explicitly; the Node Playwright image does not
      # guarantee a Python interpreter is installed.
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: native-python
        with:
          python-version: '3.12'
      - name: Install extension dependencies
        run: npm ci --ignore-scripts
      - name: Package extension for Chrome and Firefox
        run: npm run package:ci
      - name: Verify preinstalled pinned Playwright Chromium (isolated from lockfile)
        run: |
          mkdir -p "$RUNNER_TEMP/kokoro-playwright"
          cd "$RUNNER_TEMP/kokoro-playwright"
          npm init -y
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.65.0
          # The official version-matched container has already installed both
          # the browser binaries and their full Linux/system/font dependencies.
          # Fail if the exact Playwright browser or the native X11 input
          # libraries are absent; do not download/skip dependencies silently.
          node -e 'const fs = require("node:fs"); const browser = require("playwright").chromium.executablePath(); if (!fs.existsSync(browser)) throw Error("Pinned Chromium binary missing: " + browser)'
          test -x /usr/bin/Xvfb
          "${{ steps.native-python.outputs.python-path }}" -c 'import ctypes; ctypes.CDLL("libX11.so.6"); ctypes.CDLL("libXtst.so.6")'
          # Fail early unless native input reaches a focused X11 window; this
          # does not simulate or pregrant any Chromium extension permissions.
          xvfb-run -a -s '-screen 0 640x480x24' \
            "${{ steps.native-python.outputs.python-path }}" "$GITHUB_WORKSPACE/scripts/test-native-chromium-dialog-key.py"
      - name: Execute real model-backed Chrome extension inference
        if: ${{ inputs.acceptance_scope != 'chromium-quota-recovery' }}
        env:
          KOKORO_LIVE_DOWNLOAD: '1'
          KOKORO_LIVE_PROVIDER: ${{ inputs.acceptance_scope == 'chromium-dictionary' && 'dictionary' || inputs.acceptance_scope == 'chromium-mediapipe-origin' && 'mediapipe' || inputs.acceptance_scope == 'chromium-onnx-origin' && 'onnx' || 'both' }}
          KOKORO_CHROMIUM_ORIGIN_DOWNLOAD: ${{ (inputs.acceptance_scope == 'chromium-mediapipe-origin' || inputs.acceptance_scope == 'chromium-onnx-origin') && '1' || '0' }}
          KOKORO_CHROMIUM_HEADFUL_CONSENT: '1'
          KOKORO_NATIVE_PYTHON: ${{ steps.native-python.outputs.python-path }}
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/kokoro-playwright/node_modules/playwright/index.mjs
        run: |
          # Every live Chromium scope also tests optional dictionary Download,
          # Cancel and Retry after a real process restart. Preserve the headed
          # browser across both processes so native consent is interactive.
          # This workflow is explicitly opt-in (or limited to the experimental
          # branch) and is not part of routine extension CI.
          # The pinned image already includes Xvfb and browser dependencies.
          # Native optional-host dialog input uses libX11/libXtst via a small
          # standard-library Python helper; no mutable apt mirror is required.
          #
          # GitHub withholds container step logs until the step ends — mid-flight
          # stdout is invisible. Fail fast so the artifact + flushed log appear:
          # (1) stall watchdog on stage-only progress.log (not keepalive lines)
          # (2) hard 20m timeout on the whole harness process group.
          set -eu
          mkdir -p dist/runtime-acceptance
          : > dist/runtime-acceptance/progress.log
          rm -f dist/runtime-acceptance/stalled.flag
          echo "[live-wrapper] starting; stage progress mirrored below when step ends or fails fast"
          tail -n 0 -F dist/runtime-acceptance/progress.log &
          TAIL_PID=$!
          set +e
          # setsid so stall/timeout can kill xvfb+node as a group
          setsid stdbuf -oL -eL xvfb-run -a -s '-screen 0 1440x900x24' \
            stdbuf -oL -eL node scripts/validate-live-chromium.mjs &
          NODE_PID=$!
          set -e
          (
            STALL_SECS=180
            LAST_SIZE=0
            IDLE=0
            while kill -0 "$NODE_PID" 2>/dev/null; do
              sleep 15
              SIZE=$(wc -c < dist/runtime-acceptance/progress.log | tr -d ' ')
              if [ "$SIZE" -gt "$LAST_SIZE" ]; then
                LAST_SIZE=$SIZE
                IDLE=0
                echo "[live-wrapper] stage progress size=$SIZE"
              else
                IDLE=$((IDLE + 15))
                echo "[live-wrapper] no stage progress for ${IDLE}s (size=$SIZE)"
                if [ "$IDLE" -ge "$STALL_SECS" ]; then
                  echo "[live-wrapper] stall watchdog after ${STALL_SECS}s without stage progress"
                  echo "stalled-after-${STALL_SECS}s" > dist/runtime-acceptance/stalled.flag
                  kill -TERM -"$NODE_PID" 2>/dev/null || kill -TERM "$NODE_PID" 2>/dev/null || true
                  sleep 3
                  kill -KILL -"$NODE_PID" 2>/dev/null || kill -KILL "$NODE_PID" 2>/dev/null || true
                  exit 0
                fi
              fi
            done
          ) &
          WATCH_PID=$!
          set +e
          # Hard ceiling so a wedged wait cannot burn the full 60m job timeout.
          # (timeout(1) cannot wrap the shell builtin `wait`, so poll with a deadline.)
          HARD_LIMIT_SECS=1200
          START_EPOCH=$(date +%s)
          while kill -0 "$NODE_PID" 2>/dev/null; do
            NOW_EPOCH=$(date +%s)
            ELAPSED=$((NOW_EPOCH - START_EPOCH))
            if [ "$ELAPSED" -ge "$HARD_LIMIT_SECS" ]; then
              echo "[live-wrapper] hard timeout after ${HARD_LIMIT_SECS}s"
              echo "hard-timeout-${HARD_LIMIT_SECS}s" > dist/runtime-acceptance/stalled.flag
              kill -TERM -"$NODE_PID" 2>/dev/null || kill -TERM "$NODE_PID" 2>/dev/null || true
              sleep 3
              kill -KILL -"$NODE_PID" 2>/dev/null || kill -KILL "$NODE_PID" 2>/dev/null || true
              break
            fi
            sleep 5
          done
          wait "$NODE_PID" 2>/dev/null
          EXIT=$?
          set -e
          kill "$WATCH_PID" 2>/dev/null || true
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$WATCH_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo "[live-wrapper] ---- progress.log (tail) ----"
          tail -n 80 dist/runtime-acceptance/progress.log || true
          if [ -f dist/runtime-acceptance/stalled.flag ]; then
            echo "[live-wrapper] failing: $(cat dist/runtime-acceptance/stalled.flag)"
            exit 124
          fi
          echo "[live-wrapper] harness exited with $EXIT"
          exit "$EXIT"
      - name: Execute Chromium real-quota, offline multi-asset recovery acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_scope == 'chromium-quota-recovery' }}
        env:
          KOKORO_LIVE_DOWNLOAD: '1'
          KOKORO_CHROMIUM_QUOTA_ACCEPTANCE: '1'
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/kokoro-playwright/node_modules/playwright/index.mjs
        run: node scripts/validate-real-quota-chromium.mjs
      - name: Attach measured browser report (when available)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kokoro-live-chromium-report
          path: |
            dist/runtime-acceptance/report.json
            dist/runtime-acceptance/chromium-quota.json
            dist/runtime-acceptance/progress.log
            dist/runtime-acceptance/stalled.flag
          if-no-files-found: ignore

  firefox-local-inference:
    name: Real ${{ matrix.provider }} Firefox MV3 offline synthesis
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.acceptance_scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [onnx, mediapipe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install extension dependencies
        run: npm ci --ignore-scripts
      - name: Package Firefox temporary add-on
        run: npm run package:ci
      - name: Install Firefox binary
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: latest
      - name: Install pinned geckodriver
        uses: browser-actions/setup-geckodriver@5ef1526ed36211ab6cb531ec1cfb11f924ca2dee
        with:
          geckodriver-version: '0.37.1'
      - name: Install isolated Selenium driver
        run: |
          python3 -m venv "$RUNNER_TEMP/firefox-selenium"
          "$RUNNER_TEMP/firefox-selenium/bin/python" -m pip install --disable-pip-version-check selenium==4.38.0
      - name: Execute real model-backed Firefox extension inference
        env:
          KOKORO_LIVE_DOWNLOAD: '1'
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          KOKORO_FIREFOX_PROVIDER: ${{ matrix.provider }}
          MOZ_REMOTE_ALLOW_SYSTEM_ACCESS: '1'
        run: |
          "$RUNNER_TEMP/firefox-selenium/bin/python" scripts/validate-live-firefox.py
      - name: Upload Firefox acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kokoro-live-firefox-${{ matrix.provider }}-report
          path: dist/runtime-acceptance/firefox.json
          if-no-files-found: ignore

  firefox-dictionary-ui:
    name: Firefox MV3 pinned dictionary UI acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_scope == 'firefox-dictionary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install extension dependencies
        run: npm ci --ignore-scripts
      - name: Package temporary Firefox add-on
        run: npm run package:ci
      - name: Install Firefox binary
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: latest
      - name: Install pinned geckodriver
        uses: browser-actions/setup-geckodriver@5ef1526ed36211ab6cb531ec1cfb11f924ca2dee
        with:
          geckodriver-version: '0.37.1'
      - name: Install isolated Selenium driver
        run: |
          python3 -m venv "$RUNNER_TEMP/firefox-selenium"
          "$RUNNER_TEMP/firefox-selenium/bin/python" -m pip install --disable-pip-version-check selenium==4.38.0
      - name: Execute opt-in real Firefox dictionary UI acceptance
        env:
          KOKORO_LIVE_DOWNLOAD: '1'
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          KOKORO_FIREFOX_PROVIDER: dictionary
          MOZ_REMOTE_ALLOW_SYSTEM_ACCESS: '1'
        run: |
          "$RUNNER_TEMP/firefox-selenium/bin/python" scripts/validate-live-firefox.py
      - name: Upload Firefox dictionary UI acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kokoro-live-firefox-dictionary-report
          path: dist/runtime-acceptance/firefox.json
          if-no-files-found: ignore


  firefox-model-origin:
    name: Firefox MV3 model download and persistent restart acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.acceptance_scope == 'firefox-mediapipe-origin' || inputs.acceptance_scope == 'firefox-onnx-origin' || inputs.acceptance_scope == 'firefox-dual-comparison' || inputs.acceptance_scope == 'firefox-persistent-restart' || inputs.acceptance_scope == 'firefox-quota-recovery') }}
    # Keep Firefox origin on 24.04 with host Xvfb/XTest for native Alt+A
    # article/selection (Selenium keys do not reach browser.commands).
    # 60m covers origin + EPUB + article/selection + long-form memory (ONNX).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: native-python
        with:
          python-version: '3.12'
      - name: Install extension dependencies
        run: npm ci --ignore-scripts
      - name: Package Firefox temporary add-on
        run: npm run package:ci
      - name: Install Firefox binary
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: ${{ (inputs.acceptance_scope == 'firefox-persistent-restart' || inputs.acceptance_scope == 'firefox-quota-recovery') && 'latest-devedition' || 'latest' }}
      - name: Install pinned geckodriver
        uses: browser-actions/setup-geckodriver@5ef1526ed36211ab6cb531ec1cfb11f924ca2dee
        with:
          geckodriver-version: '0.37.1'
      - name: Install isolated Selenium driver
        run: |
          python3 -m venv "$RUNNER_TEMP/firefox-selenium"
          "$RUNNER_TEMP/firefox-selenium/bin/python" -m pip install --disable-pip-version-check selenium==4.38.0
      - name: Verify host Xvfb and native X11 input libraries
        run: |
          test -x /usr/bin/Xvfb
          "${{ steps.native-python.outputs.python-path }}" -c 'import ctypes; ctypes.CDLL("libX11.so.6"); ctypes.CDLL("libXtst.so.6")'
          xvfb-run -a -s '-screen 0 640x480x24' \
            "${{ steps.native-python.outputs.python-path }}" "$GITHUB_WORKSPACE/scripts/test-native-chromium-dialog-key.py"
      - name: Execute manually scoped Firefox acceptance
        env:
          KOKORO_LIVE_DOWNLOAD: '1'
          KOKORO_FIREFOX_ORIGIN_DOWNLOAD: ${{ (inputs.acceptance_scope == 'firefox-persistent-restart' || inputs.acceptance_scope == 'firefox-dual-comparison') && '0' || '1' }}
          KOKORO_FIREFOX_PERSISTENT_RESTART: ${{ inputs.acceptance_scope == 'firefox-persistent-restart' && '1' || '0' }}
          KOKORO_FIREFOX_QUOTA_ACCEPTANCE: ${{ inputs.acceptance_scope == 'firefox-quota-recovery' && '1' || '0' }}
          KOKORO_FIREFOX_PROVIDER: ${{ inputs.acceptance_scope == 'firefox-dual-comparison' && 'both' || inputs.acceptance_scope == 'firefox-onnx-origin' && 'onnx' || 'mediapipe' }}
          KOKORO_FIREFOX_DUAL_COMPARISON: ${{ inputs.acceptance_scope == 'firefox-dual-comparison' && '1' || '0' }}
          KOKORO_NATIVE_PYTHON: ${{ steps.native-python.outputs.python-path }}
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          MOZ_REMOTE_ALLOW_SYSTEM_ACCESS: '1'
        run: |
          # Headed Firefox under Xvfb so read-article Alt+A reaches commands.
          xvfb-run -a -s '-screen 0 1440x900x24' \
            "$RUNNER_TEMP/firefox-selenium/bin/python" scripts/validate-live-firefox.py
      - name: Upload official-origin Firefox acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kokoro-live-${{ inputs.acceptance_scope }}-report
          path: |
            dist/runtime-acceptance/firefox.json
            dist/runtime-acceptance/firefox-quota.json
          if-no-files-found: ignore
